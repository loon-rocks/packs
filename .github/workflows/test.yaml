name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packs:
    runs-on: ubuntu-24.04
    container: ghcr.io/loon-rocks/dive:v0.18.0
    env:
      SLACK_BOT_TOKEN: xoxb-not-a-real-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: dive pack test

  web-source:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.94 --profile minimal --component clippy,rustfmt && rustup default 1.94
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
